---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}spotylist-php-dev
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # Caddy proxifie le front vers le conteneur `front` (ng serve)
      FRONT_MODE: dev
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  # Le worker garde le code en mémoire : `make worker-restart` après une modification d'un handler.
  worker:
    image: ${IMAGES_PREFIX:-}spotylist-php-dev
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"

  database:
    ports:
      - "5432"

  # Serveur de dev Angular, servi derrière Caddy sur https://127.0.0.1
  front:
    image: node:24-alpine
    working_dir: /app
    command: [ "sh", "-c", "npm install --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200" ]
    volumes:
      - ./front:/app
      # node_modules Linux propre au conteneur (binaires natifs esbuild, etc.)
      - front_node_modules:/app/node_modules
    environment:
      NG_CLI_ANALYTICS: "false"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200" ]
      interval: 10s
      start_period: 120s

volumes:
  front_node_modules:
